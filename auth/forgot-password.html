<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>استعادة كلمة المرور | Kshkooll</title><link rel="stylesheet" href="auth.css">
<style>
.recovery{max-width:500px;margin:70px auto;padding:34px;background:var(--paper);border:1px solid #e8dfcd;border-radius:20px;box-shadow:var(--shadow);color:var(--ink)}
.recovery h1{font-size:28px}.recovery p{color:var(--muted);line-height:1.9}.recovery label{display:block;margin:18px 0 7px}.recovery input{width:100%;height:48px;padding:0 12px;border:1px solid #d9e1ed;border-radius:10px}.recovery button{width:100%;margin-top:18px;height:49px;border:0;border-radius:11px;background:var(--blue);color:white}.recovery a{color:var(--blue)}.status{min-height:24px;color:#a33}
</style><script src="../js/theme.js" defer></script></head>
<body><main class="page">
<header class="topbar"><a class="brand" href="../index.html"><img src="../assets/images/logo.svg" alt="Kshkooll"><span><strong>Kshkooll</strong><small>EGYPTIAN BACCALAUREATE 2027</small></span></a><button class="theme-toggle" id="themeToggle" type="button">☼</button></header>
<section class="recovery"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>نسيت كلمة المرور؟</h1><p>اكتب البريد الإلكتروني المرتبط بحسابك وسنرسل لك رابطًا لتغيير كلمة المرور.</p>
<form id="forgotForm"><label for="recoveryIdentity">البريد الإلكتروني</label><input id="recoveryIdentity" required placeholder="name@gmail.com"><button type="submit">متابعة</button><p class="status" id="forgotStatus" role="status"></p></form>
<a href="login.html">العودة إلى تسجيل الدخول</a></section></main><script type="module" src="auth.js"></script></body></html>
