<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة المرور | Kshkooll</title><link rel="stylesheet" href="auth.css">
<style>
.recovery{max-width:500px;margin:70px auto;padding:34px;background:var(--paper);border:1px solid #e8dfcd;border-radius:20px;box-shadow:var(--shadow);color:var(--ink)}
.recovery h1{font-size:28px}.recovery p{color:var(--muted);line-height:1.9}.recovery label{display:block;margin:18px 0 7px}
.recovery input{width:100%;height:48px;padding:0 12px;border:1px solid #d9e1ed;border-radius:10px}
.recovery button{width:100%;margin-top:18px;height:49px;border:0;border-radius:11px;background:var(--blue);color:white}
.status{min-height:24px;color:#a33}
</style><script src="../js/theme.js" defer></script></head>
<body><main class="page">
<header class="topbar"><a class="brand" href="../pages/dashboard.html"><img src="../assets/images/logo.svg" alt="Kshkooll"><span><strong>Kshkooll</strong><small>EGYPTIAN BACCALAUREATE 2027</small></span></a></header>
<section class="recovery"><span class="eyebrow">NEW PASSWORD</span><h1>اختار كلمة مرور جديدة</h1>
<form id="resetPasswordForm">
<label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="10" required autocomplete="new-password">
<label for="confirmNewPassword">تأكيد كلمة المرور</label><input id="confirmNewPassword" type="password" minlength="10" required autocomplete="new-password">
<button type="submit">حفظ كلمة المرور</button><p class="status" id="resetStatus" role="status"></p>
</form><a href="login.html">العودة لتسجيل الدخول</a></section></main>
<script type="module" src="auth.js"></script></body></html>
